name: Docker Hub Push

on:
  workflow_call:
    inputs:
      build-run-id:
        description: "Docker Build workflow run ID"
        type: string
        required: true

      image-tag:
        description: "Docker image tag"
        type: string
        required: true

jobs:
    docker-push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: Download Docker image
              uses: actions/download-artifact@v4
              with:
                name: nodegoat-image
                run-id: ${{ inputs.build-run-id }}
                github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Load Docker image
              run: docker load -i nodegoat.tar

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Tag Docker image
              run: |
                docker tag nodegoat:ci ${{ secrets.DOCKER_USERNAME }}/nodegoat:${{ inputs.image-tag }}
                docker tag nodegoat:ci ${{ secrets.DOCKER_USERNAME }}/nodegoat:latest

            - name: push Docker image
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/nodegoat:${{ inputs.image-tag }}
                docker push ${{ secrets.DOCKER_USERNAME }}/nodegoat:latest
            
            
