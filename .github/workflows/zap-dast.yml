name: ZAP DAST

on:
  workflow_call:
    secrets:
      EC2_HOST:
        required: true

jobs:
    zap-dast:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: Run OWASP ZAP
              uses: zaproxy/action-baseline@v0.15.0
              with:
                target: http://${{ secrets.EC2_HOST }}:4000
                allow_issue_writing: false
